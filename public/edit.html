<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Edit Expense</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for(filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark brand-gradient">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/"><i class="bi bi-wallet2 me-2"></i>Finance Manager</a>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card card-elevated">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h5 class="card-title mb-0">Edit Expense</h5>
              <a href="{{ url_for('index') }}" class="btn btn-link text-decoration-none">
                <i class="bi bi-arrow-left"></i> Back
              </a>
            </div>

            <form action="{{ url_for('edit_expense', id=expense.id) }}" method="POST" class="row g-3">
              <div class="col-12">
                <label class="form-label">Description</label>
                <input type="text" name="description" class="form-control" value="{{ expense.description }}" required>
              </div>

              <div class="col-6">
                <label class="form-label">Amount</label>
                <div class="input-group">
                  <span class="input-group-text">₹</span>
                  <input type="number" step="0.01" name="amount" class="form-control" value="{{ expense.amount }}" required>
                </div>
              </div>

              <div class="col-6">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                  {% for opt in ['Food','Travel','Bills','Shopping','Other'] %}
                    <option value="{{ opt }}" {% if expense.category==opt %}selected{% endif %}>{{ opt }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-6">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control" value="{{ date_value }}">
              </div>

              <div class="col-6">
                <label class="form-label">Wallet</label>
                <select name="wallet_id" class="form-select">
                  {% for w in wallets %}
                    <option value="{{ w.id }}" {% if expense.wallet_id==w.id %}selected{% endif %}>
                      {{ w.name }} {% if w.is_primary %}(Primary){% endif %}
                    </option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark">
                  <i class="bi bi-check2-circle me-2"></i>Save Changes
                </button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
