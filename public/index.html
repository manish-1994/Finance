<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login — Finance Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for(filename='style.css') }}">
  <style>
    body{ min-height:100vh; display:grid; place-items:center; background:#0b1220; }
    .login-card{ width:100%; max-width:380px; background:#0f172a; border:1px solid #273244; border-radius:.75rem; box-shadow:0 10px 30px rgba(0,0,0,.45); }
    .login-card .card-body{ padding:1.5rem; }
    .login-card h1{ font-size:1.25rem; color:#e7ecf3; }
    .form-control{ background:#0b1220; color:#e7ecf3; border-color:#273244; }
    .form-control::placeholder{ color:#9fb2c8; }
    .btn-dark{ width:100%; }
    .error{ color:#fca5a5; margin-top:.5rem; }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="card-body">
      <h1 class="mb-3">Finance Manager</h1>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="admin" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="pass123" required>
        </div>
        <button type="submit" class="btn btn-dark">Login</button>
      </form>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </div>
  </div>
</body>
</html>
